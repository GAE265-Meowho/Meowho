<title>新增送養貓咪</title>
<!--
  中途新增送養貓流程（設計稿實作版）
  流程：拍照（正面、側面、背面＋其他照片）→ 說說牠（語音轉文字→可修改→送出填表）→ 快問快答 7 頁（個性、照顧、習慣、問題行為、相處、剛到家、摸摸牠）→ 確認名片 → 完成

  接進 Meowho 時：
  - 色票、按鈕照 docs/design/DESIGN.md v2，:root 的 token 名稱和 globals.css 相同，搬成 CSS Module 時直接刪掉這裡的 :root。
  - 貓形按鈕對應 components/ui/CatButton.tsx；必填「＊」對應 components/ui/Required.tsx。
  - parseStory() 是示範用的規則式擷取。正式版改呼叫 POST /api/onboarding/turn（lib/onboarding/conversation.ts）。
  - toMeowhoPayload() 把畫面狀態轉成 meow_cats 的欄位。照護配合度、觸摸、剛到家、相處細項放在新的 care jsonb（資料庫還沒有，要加 migration）。
  - 正面、側面、背面三張給 3D 流程用（側面必填＝AI 三視角的上色照，正面、背面當參考圖，沒拍 AI 補）；其他照片進 photo_paths（目前上限 5 張，要放寬或分開存）。
  - 個性改成四條兩端量表（活動量、跟人的距離、膽量、適應新環境，各 1–5 格，參考巴克幫的性格量表），
    個性標籤由量表自動產生（personalityTags()），和遊戲 24e-adopt.js 用的標籤一致：慵懶／活潑、獨立／黏人、膽小／怕生／親人、愛咬人。
  - 問題行為（沒有／偶爾／常常／不確定）：「沒有」也會顯示在名片上。
  - 健康標籤：前五個遊戲已有寫好的劇情；其他標籤和「其他身體狀況」自己填的內容，試養遊戲交給 AI 依這段安排劇情（payload 的 medical.ai_story）。
  - 示範版不存檔、不上傳，照片只在瀏覽器裡預覽。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root {
  --paper: #fbf5ea;  --cream: #fffaf0;  --card: #ffffff;  --line: #efe3cf;
  --ink: #3f2e24;    --ink-soft: #7a6252;
  --yellow: #f6b53b; --yellow-deep: #e9a21f; --yellow-soft: #fdedc4;
  --orange: #e8913a; --orange-deep: #a8562a; --orange-soft: #fde3c6;
  --heading-orange: #b25e16;
  --caramel: #a5602a; --caramel-deep: #7d4517;
  --pink: #f4b2ad;   --pink-soft: #fde7e4; --mint-soft: #e3f2e7;
  --tap: 36px;
}
@media (pointer: coarse) { :root { --tap: 44px; } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: Quicksand, "Zen Maru Gothic", "Noto Sans TC", sans-serif; font-size: 15px; line-height: 1.6;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
a { color: var(--orange-deep); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.page { max-width: 480px; margin: 0 auto; padding: 0 20px calc(32px + env(safe-area-inset-bottom)); min-height: 100vh; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.top .title { font-weight: 700; font-size: 17px; letter-spacing: .06em; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; border-radius: 50%; }
.icon-btn[disabled] { visibility: hidden; }
.home-chip { font-size: 13px; font-weight: 700; background: var(--yellow-soft); padding: 4px 10px; border-radius: 999px; }

.steps { list-style: none; margin: 4px 0 22px; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.steps li { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-soft); }
.steps li i { height: 6px; border-radius: 3px; background: var(--line); }
.steps li.done i, .steps li.now i { background: var(--caramel); }
.steps li.now { color: var(--ink); font-weight: 700; }

h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.4; letter-spacing: .06em; }
h2 { margin: 0; font-size: 18px; letter-spacing: .04em; }
.lead { margin: 0 0 18px; font-size: 15px; line-height: 1.7; color: var(--ink-soft); }
.muted { color: var(--ink-soft); }
.card { background: var(--card); border-radius: 30px; box-shadow: 0 6px 0 -1px var(--line); padding: 18px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grow { flex-grow: 1; }
.kicker { font-size: 14px; font-weight: 700; background: var(--yellow); color: var(--ink); padding: 4px 12px; border-radius: 999px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tag { font-size: 12px; font-weight: 700; color: var(--orange-deep); }
.req { color: var(--orange-deep); font-weight: 700; }

/* ---------- 貓形 pill 按鈕（components/ui/CatButton.tsx） ---------- */
.cat-btn { position: relative; isolation: isolate; display: flex; align-items: center; justify-content: center; width: 100%; height: 54px; margin-top: 16px;
  border: 0; border-radius: 999px; background: var(--caramel); color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .06em;
  box-shadow: 0 6px 0 var(--caramel-deep); text-decoration: none; transition: transform .15s; }
.cat-btn .ears { position: absolute; left: 26px; top: -15px; width: 56px; height: 20px; z-index: -1; fill: var(--caramel); }
.cat-btn .tail { position: absolute; right: -10px; top: 16px; width: 22px; height: 38px; z-index: -1; }
.cat-btn .tail .body { fill: var(--caramel); }
.cat-btn .tail .stripes path { stroke: #c98a54; stroke-width: 14; fill: none; }
.cat-btn:hover { transform: translateY(-2px); }
.cat-btn:hover .tail { animation: wag .5s ease-in-out 2; transform-origin: 0 0; }
@keyframes wag { 50% { transform: rotate(8deg); } }
.ghost-btn { min-height: 44px; padding: 0 20px; border: 2px solid var(--orange); border-radius: 999px; background: var(--card); color: var(--orange-deep); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.dark-btn { min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--ink); color: var(--yellow-soft); font-size: 15px; font-weight: 700; }
.link-btn { min-height: 44px; border: 0; background: transparent; color: var(--orange-deep); font-size: 15px; font-weight: 700; padding: 0 4px; }
.missing { margin: 16px 0 0; padding: 10px 14px; border-radius: 18px; background: var(--pink-soft); font-size: 14px; }

/* ---------- 選項 ---------- */
.seg { display: grid; gap: 6px; }
.opt { min-height: var(--tap); min-height: 44px; padding: 0 10px; border: 2px solid var(--line); border-radius: 999px; background: var(--cream); font-size: 14px; font-weight: 700; }
.opt[aria-checked="true"], .opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--yellow); }
.chip { min-height: 44px; padding: 0 14px; border: 2px solid var(--line); border-radius: 999px; background: var(--card); font-size: 14px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--yellow-soft); border-color: var(--caramel); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .label { font-size: 14px; font-weight: 700; }
.input { height: 44px; border: 2px solid var(--line); border-radius: 999px; background: var(--card); padding: 0 16px; font-size: 15px; width: 100%; }
.input::placeholder, textarea::placeholder { color: #8f7663; }
.input:focus, textarea:focus { outline: none; border-color: var(--orange); }
.input.guess { border-color: var(--yellow); background: var(--yellow-soft); }
.age-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* ---------- 拍照 ---------- */
.angles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.slot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border: 2px dashed var(--orange); border-radius: 28px; background: var(--cream); cursor: pointer; text-align: center; }
.slot.has { border-style: solid; border-color: var(--caramel); background: var(--yellow-soft); }
.slot svg, .slot .photo { width: 100%; max-width: 150px; aspect-ratio: 350 / 284; }
.slot .photo { object-fit: cover; border-radius: 18px; }
.slot b { font-size: 16px; }
.slot span { font-size: 13px; color: var(--ink-soft); }
.slot .badge { position: absolute; top: 10px; right: 10px; font-size: 12px; font-weight: 700; background: var(--ink); color: var(--yellow-soft); padding: 2px 8px; border-radius: 999px; }
.slot input, .add input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.angles.three { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 10px; }
.angles.three .slot { padding: 10px 6px; border-radius: 24px; }
.angles.three .slot b { font-size: 15px; }
.angles.three .slot span { font-size: 12px; line-height: 1.4; }
.add { gap: 2px; align-content: center; }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.thumb { position: relative; aspect-ratio: 1 / 1; }
.thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 46% 54% 42% 58% / 52% 44% 56% 48%; background: var(--orange-soft); }
.set-cover { position: absolute; z-index: 2; min-height: 30px; padding: 0 10px; border: 1.5px solid var(--caramel); border-radius: 999px; background: var(--card); color: var(--orange-deep); font-size: 12px; font-weight: 700; white-space: nowrap; }
.set-cover.on { background: var(--ink); border-color: var(--ink); color: var(--yellow-soft); }
.slot .set-cover { top: 8px; left: 50%; transform: translateX(-50%); }
.thumb .set-cover { left: 50%; bottom: -10px; transform: translateX(-50%); }
.thumb .cover { position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%); font-size: 12px; font-weight: 700; background: var(--ink); color: var(--yellow-soft); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.thumb .rm { position: absolute; top: -6px; right: -6px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; padding: 0; }
.add { position: relative; aspect-ratio: 1 / 1; border: 2px dashed var(--orange); border-radius: 20px; background: var(--cream); color: var(--orange-deep); display: grid; place-items: center; }

/* ---------- 說說牠 ---------- */
.mic { width: 84px; height: 84px; border: 0; border-radius: 50%; background: var(--caramel); color: #fff; box-shadow: 0 6px 0 var(--caramel-deep); display: grid; place-items: center; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.mic.on { background: var(--orange-deep); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
textarea.story { width: 100%; border: 2px solid var(--orange); border-radius: 22px; background: var(--cream); padding: 12px 14px; resize: vertical; font-size: 15px; line-height: 1.8; min-height: 140px; }
.legend { display: flex; gap: 14px; justify-content: center; margin: 18px 0 10px; font-size: 13px; color: var(--ink-soft); flex-wrap: wrap; }
.hlist { display: flex; flex-direction: column; }
.hrow { display: flex; flex-direction: column; gap: 10px; padding: 16px 0; border-top: 1.5px dashed var(--line); }
.hrow:first-child { border-top: 0; padding-top: 4px; }
.hrow > .label { font-size: 15px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
.hrow .seg { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
.hrow .opt { min-height: 46px; padding: 0 4px; font-size: 14px; }
.note { margin: 0; font-size: 14px; color: var(--ink-soft); }
.status { margin: 0; font-size: 14px; font-weight: 700; color: var(--orange-deep); min-height: 1.6em; text-align: center; }

/* ---------- 快問快答 ---------- */
.qrow { padding: 10px 0; border-bottom: 1.5px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
.qrow:last-child { border-bottom: 0; }
.opt { white-space: nowrap; }
.qrow .opt { padding: 0 2px; font-size: 13px; letter-spacing: 0; }
@media (min-width: 400px) { .qrow .opt { font-size: 14px; } }
.qgroup p { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: var(--ink-soft); }

/* ---------- 摸摸牠 ---------- */
.legend4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; font-size: 13px; text-align: center; }
.legend4 span { padding: 6px 2px; border-radius: 999px; font-weight: 700; }
.catbox { position: relative; width: 100%; max-width: 350px; margin: 0 auto; aspect-ratio: 350 / 330; background: var(--card); border-radius: 32px; box-shadow: 0 6px 0 -1px var(--line); overflow: hidden; }
.catbox > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.zone { position: absolute; transform: translate(-50%, -50%); min-height: 44px; padding: 2px 4px; border-radius: 22px; font-size: 14px; font-weight: 700; line-height: 1.25; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(255, 250, 240, .9); border: 2px dashed var(--orange-deep); }
.zone small { font-size: 12px; font-weight: 500; }
.z1 { background: var(--caramel); color: #fff; border: 2px solid var(--caramel); }
.z2 { background: var(--yellow-soft); border: 2px solid var(--caramel); }
.z3 { background: var(--pink-soft); border: 2px dashed var(--orange-deep); }

/* ---------- 名片 ---------- */
.preview { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 14px; align-items: center; }
.blob { aspect-ratio: 1 / 1; background: var(--yellow-soft); border-radius: 46% 54% 42% 58% / 52% 44% 56% 48%; overflow: hidden; display: grid; place-items: center; }
.blob img { width: 100%; height: 100%; object-fit: cover; }
.pill { font-size: 13px; background: var(--yellow-soft); padding: 3px 10px; border-radius: 999px; }
.pill.ok { background: var(--mint-soft); } .pill.warn { background: var(--pink-soft); }
details { border-bottom: 1.5px dashed var(--line); padding: 12px 0; }
details:last-child { border-bottom: 0; }
summary { list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 36px; cursor: pointer; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary b { font-size: 16px; }
summary span { font-size: 14px; color: var(--ink-soft); text-align: right; }
dl.kv { margin: 8px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
dl.kv dt { color: var(--ink-soft); } dl.kv dd { margin: 0; }
.week { background: var(--yellow-soft); border-radius: 28px; padding: 16px 18px; }
.week ul { margin: 8px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.7; }
.consent { margin-top: 20px; display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.7; cursor: pointer; }
.consent input { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--caramel); flex: none; }

/* ---------- 完成 ---------- */
.done-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.done-hero .blob { width: 148px; }

/* ---------- 可點的小框：一樣大小的格子 ---------- */
.chips.even { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.chips.even .chip { width: 100%; padding: 4px 6px; line-height: 1.3; white-space: normal; text-align: center; }

/* ---------- 個性：可以拉的量表（五個節點） ---------- */
.slider { position: relative; height: 44px; }
.slider .rail { position: absolute; left: 8px; right: 8px; top: 50%; transform: translateY(-50%); display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.slider .rail::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--line); }
.slider .rail i { position: relative; width: 12px; height: 12px; border-radius: 50%; background: var(--line); border: 2px solid var(--card); }
.range { position: relative; z-index: 1; -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer; touch-action: pan-y; }
.range:focus { outline: none; }
.range:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 22px; }
.range::-webkit-slider-runnable-track { height: 44px; background: transparent; }
.range::-moz-range-track { height: 44px; background: transparent; }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: 8px; border-radius: 50%; background: var(--caramel); border: 4px solid #fff; box-shadow: 0 3px 0 var(--caramel-deep); }
.range::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--caramel); border: 4px solid #fff; box-shadow: 0 3px 0 var(--caramel-deep); }
.range.unset::-webkit-slider-thumb { background: var(--card); border: 3px dashed var(--orange); box-shadow: none; }
.range.unset::-moz-range-thumb { background: var(--card); border: 3px dashed var(--orange); box-shadow: none; }
.words { display: flex; justify-content: space-between; margin: 0 -14px; }
.words span { width: 56px; text-align: center; font-size: 13px; color: var(--ink-soft); }
.words span.on { color: var(--orange-deep); font-weight: 700; }

/* ---------- 個性量表 ---------- */
.trait { padding: 14px 0; border-bottom: 1.5px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
.trait:last-child { border-bottom: 0; }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale .opt { padding: 0; font-size: 15px; }
.ends { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--ink-soft); }
.ends span:last-child { text-align: right; }
.mrow { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1.5px dashed var(--line); }
.mrow:last-child { border-bottom: 0; padding-bottom: 0; }
.mrow b { font-size: 15px; }
.meter { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.meter i { height: 10px; border-radius: 5px; background: var(--line); }
.meter i.on { background: var(--caramel); }
.mrow .ends { font-size: 12px; }
.mrow q { font-size: 14px; color: var(--ink); quotes: "「" "」"; }
.pill.mid { background: var(--orange-soft); }
.pill.plain { background: var(--cream); border: 1.5px solid var(--line); }
.nick { align-self: flex-start; font-size: 13px; font-weight: 700; background: var(--ink); color: var(--yellow-soft); padding: 2px 10px; border-radius: 999px; }
.story-card { background: var(--cream); border: 2px solid var(--line); border-radius: 28px; padding: 16px 18px; }
.story-card p { margin: 8px 0 0; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
.sub { font-size: 13px; color: var(--ink-soft); margin: -2px 0 0; }
.rowline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* ---------- 版面：手機單欄 → 平板加寬 → 桌機雙欄（斷點照 DESIGN.md §9） ---------- */
.cols { display: flex; flex-direction: column; gap: 16px; }
.cols .legend { margin: 16px 0 0; }
.h1s { font-size: 26px; line-height: 1.45; letter-spacing: .04em; }
.narrow { width: 100%; }
.cta { display: flex; flex-direction: column; align-items: stretch; }
.cta-alt { order: 3; align-self: center; margin-top: 10px; }
.done-actions .two { margin-top: 18px; }

@media (min-width: 768px) {
  .page { max-width: 760px; padding-left: 32px; padding-right: 32px; }
  .thumbs { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  /* 拍照頁從平板起就分兩欄：標題在上，左邊四個角度的框，右邊其他照片 */
  .cols.photo-cols { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); grid-template-areas: "head head" "main side"; grid-template-rows: auto auto; column-gap: 28px; row-gap: 16px; align-items: start; }
  .cols.photo-cols .a-head { grid-area: head; }
  .cols.photo-cols .a-main { grid-area: main; }
  .cols.photo-cols .a-side { grid-area: side; position: sticky; top: 24px; }
  .cols.photo-cols .lead { max-width: 640px; }
  .cols.photo-cols .angles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols.photo-cols .thumbs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 1024px) { .cols.photo-cols { column-gap: 40px; } .cols.photo-cols .thumbs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

@media (min-width: 1024px) {
  .page { max-width: 1180px; padding: 8px 40px 56px; }
  .top { height: 72px; }
  .top .title { font-size: 20px; }
  .steps { max-width: 720px; margin: 8px 0 36px; gap: 10px; }
  .steps li { font-size: 14px; }

  const said = k => { S.said.add(k); S.guessed.delete(k); n++; };
  const first = text.split(/[，,。\s]/)[0];
  if (first && first.length <= 6 && !/\d|撿|在|我|牠|他|她/.test(first)) { S.f.name = first; said("name"); }
  if (/母的|母貓|女生|妹妹/.test(text)) { S.f.sex = 1; said("sex"); }
  else if (/公的|公貓|男生|弟弟/.test(text)) { S.f.sex = 0; said("sex"); }
  let m = text.match(/([\d一二兩三四五六七八九十]+)\s*個?月/);
  if (m && num(m[1]) != null) { S.f.ageNum = String(num(m[1])); S.f.ageUnit = 0; S.f.stage = stageOf(); S.f.ageText = `約 ${num(m[1])} 個月`; said("stage"); }
  else if ((m = text.match(/([\d一二兩三四五六七八九十]+)\s*歲/)) && num(m[1]) != null) { const y = num(m[1]); S.f.ageNum = String(y); S.f.ageUnit = 1; S.f.stage = stageOf(); S.f.ageText = `約 ${y} 歲`; said("stage"); }
  if ((m = text.match(/(\d{1,2})\/(\d{1,2})/))) { S.f.since = `${new Date().getFullYear()}/${m[1].padStart(2, "0")}/${m[2].padStart(2, "0")}`; said("since"); }
  if (/撿到|街貓|浪貓/.test(text)) { S.f.from = 0; said("from"); }
  else if (/棄養|被丟/.test(text)) { S.f.from = 1; said("from"); }
  else if (/前飼主|原飼主/.test(text)) { S.f.from = 2; said("from"); }
  else if (/收容所/.test(text)) { S.f.from = 3; said("from"); }
  if (/還沒結紮|未結紮|沒結紮/.test(text)) { S.h.neuter = 1; said("neuter"); }
  else if (/已結紮|結紮了|有結紮/.test(text)) { S.h.neuter = 0; said("neuter"); }
  if ((m = text.match(/([\d一二兩三四五])\s*劑/))) { const d = num(m[1]); S.h.vaccine = Math.min(3, d); said("vaccine"); }
  if (/體內外驅蟲|內外驅蟲/.test(text)) { S.h.deworm = [0, 1]; said("deworm"); }
  else if (/體內驅蟲/.test(text)) { S.h.deworm = [0]; said("deworm"); }
  else if (/體外驅蟲/.test(text)) { S.h.deworm = [1]; said("deworm"); }
  if (/FIV|FeLV|愛滋|白血/i.test(text)) { if (/陰性/.test(text)) { S.h.fiv = 0; said("fiv"); } else if (/陽性/.test(text)) { S.h.fiv = 1; said("fiv"); } }
  if (/晶片/.test(text)) { S.h.chip = /沒有晶片|還沒.*晶片/.test(text) ? 1 : 0; said("chip"); }
  const TW = [[/超黏|很黏|黏人|跟前跟後|跟屁蟲/, "bond", 5], [/很獨立|不黏人|不愛被抱/, "bond", 1], [/獨立/, "bond", 2],
    [/很活潑|超好動|精力旺盛|很皮/, "energy", 5], [/活潑|好動/, "energy", 4], [/很懶|愛睡|懶懶/, "energy", 1], [/安靜/, "energy", 2],
    [/很膽小|超膽小|膽小/, "brave", 1], [/怕生|害羞/, "brave", 2], [/親人|不怕人|主動靠近/, "brave", 5], [/大膽|膽子大/, "brave", 4],
    [/適應很快|很快就適應/, "adapt", 5], [/慢熱|適應很慢/, "adapt", 2]];
  const seen = new Set();
  TW.forEach(([re, k, v]) => { if (!seen.has(k) && re.test(text)) { S.traits[k] = v; seen.add(k); said("traits." + k); } });
  EXTRA_PERS.forEach(t => { if (text.includes(t)) { S.personality.add(t); n++; } });
  if (/很愛吃|愛吃/.test(text)) S.personality.add("貪吃");
  HEALTH_TAGS.forEach(([t]) => { if (text.includes(t)) S.h.tags.add(t); });
  if (/腎/.test(text)) S.h.tags.add("慢性腎病");
  if (S.h.tags.size) said("htags");
  if ((m = text.match(/躲了?([\d一二兩三四五六七])天/))) { const d = num(m[1]); S.arrival.hide = d <= 0 ? 0 : d <= 3 ? 1 : d <= 7 ? 2 : 3; said("arrival.hide"); if (/吃/.test(text)) { S.arrival.eat = S.arrival.hide; said("arrival.eat"); } }
  if (/剪指甲.{0,8}(毛巾|兩個人|包)/.test(text)) { S.care.nail = 1; said("care.nail"); }
  if (/會用貓砂/.test(text)) { S.habits.add("litter"); said("habits.litter"); }
  if (/咬手|咬人|會抓人/.test(text)) { S.prob.bite = 1; said("prob.bite"); }
  if (/亂尿/.test(text)) { S.prob.pee = 1; said("prob.pee"); }
  if (/逗貓棒/.test(text)) { S.habits.add("wand"); said("habits.wand"); }
  if (/抓沙發|抓家具/.test(text)) { S.prob.scratch = 1; said("prob.scratch"); }
  return n;
}

function shell(inner, back) {
  const idx = STEP_OF[S.step];
  const steps = STEP_LABEL.map((l, i) => `<li class="${i < idx ? "done" : i === idx ? "now" : ""}"><i></i>${l}</li>`).join("");
  return `<header class="top">
      <button type="button" class="icon-btn" aria-label="上一步" data-act="back" ${back ? "" : "disabled"}>${BACK_ICON}</button>
      <span class="title">新增貓咪</span><span class="home-chip">${esc(HOME)}</span>
    </header>
    <ol class="steps" aria-label="進度：第 ${idx + 1} 步，共 5 步">${steps}</ol>${inner}`;
}
// 封面：中途點「設為封面」選的那張（a:正面/側面/背面、o:其他照片第幾張）；沒選就用其他照片第一張，再來是正面、側面、背面
function coverSrc() {
  const c = S.cover;
  if (c && c[0] === "a" && S.angles[c.slice(2)]) return S.angles[c.slice(2)];
  if (c && c[0] === "o" && S.others[+c.slice(2)]) return S.others[+c.slice(2)];
  return S.others[0] || S.angles.front || S.angles.left || S.angles.back || null;
}
const isCover = src => !!src && coverSrc() === src;
const coverBtn = (key, src) => isCover(src) ? `<button type="button" class="set-cover on" data-act="cover" data-v="${key}" aria-pressed="true">封面</button>` : `<button type="button" class="set-cover" data-act="cover" data-v="${key}" aria-pressed="false">設為封面</button>`;
function missingBox() { return S.missing.length ? `<p class="missing" role="alert">還沒填：${S.missing.map(esc).join("、")}</p>` : ""; }

function vPhoto() {
  const slots = ANGLES.map(a => {
    const src = S.angles[a.id];
    return `<label class="slot ${src ? "has" : ""}">
      ${src ? `<img class="photo" src="${src}" alt="${a.name}照片">` : guide(a.id, "#fffaf0")}
      <b>${a.name}${a.required ? '<span class="req" aria-label="必填">＊</span>' : ""}</b>
      <span>${src ? "點一下重拍" : a.hint}</span>
      ${src ? coverBtn("a:" + a.id, src) : ""}
      <input type="file" accept="image/*" capture="environment" data-angle="${a.id}" aria-label="拍${a.name}照片">
    </label>`;
  }).join("");
  const thumbs = S.others.map((src, i) => `<div class="thumb"><img src="${src}" alt="其他照片 ${i + 1}">${coverBtn("o:" + i, src)}<button type="button" class="rm" aria-label="移除第 ${i + 1} 張" data-act="rmOther" data-v="${i}">×</button></div>`).join("");
  const add = S.others.length < MAX_OTHERS ? `<label class="add" aria-label="新增其他照片">${PLUS}<input type="file" accept="image/*" multiple data-others="1"></label>` : "";
  return shell(`
    <div class="cols">
      <div class="a-head">
        <h1>拍牠的正面、側面、背面</h1>
        <p class="lead">點一格開相機，讓牠站著，盡量拍到全身。我們會用這三張做出牠的 3D 模樣；正面和背面沒拍的話，AI 會補。</p>
      </div>
      <div class="angles three">${slots}</div>
      <section class="card stack" style="gap:10px" aria-labelledby="more">
        <div class="row-between"><h2 id="more" style="font-size:16px">其他照片（選填）</h2><span class="muted" style="font-size:13px">${S.others.length} / ${MAX_OTHERS}</span></div>
        <p class="note" style="font-size:13px">生活照、睡覺、玩耍都好。點照片上的「設為封面」，選一張當名片封面。</p>
        <div class="thumbs">${thumbs}${add}</div>
      </section>
    </div>
    <div class="grow"></div>
    <div class="cta">${missingBox()}${catBtn("下一步：說說牠", "toTalk")}</div>`, false);
}

function weekLines() {
  const L = [], a = S.arrival, n = S.f.name || "牠", T = S.traits, B = S.prob;
  if (a.hide != null) L.push(["剛到家當天就會出來走動", "前 1 到 3 天會躲起來，給牠一個安靜的角落", "第一週大多躲著，要有耐心", "要一週以上才會出來，先別急著抱"][a.hide]);
  else if (T.adapt && T.adapt <= 2) L.push("換環境要比較久才適應，先準備一個能躲的地方");
  if (T.brave && T.brave <= 2) L.push("怕生，有客人來時可能躲一整晚，別硬把牠抱出來");
  if (T.bond >= 4) L.push("熟了以後很黏人，你走到哪跟到哪");
  if (T.bond && T.bond <= 2) L.push("喜歡有自己的空間，摸太久會不高興");
  if (T.energy >= 4) L.push("精力很好，每天要留時間陪玩");
  if (isBad(B.bite)) L.push("玩到興奮會咬手，準備逗貓棒轉移");
  if (isBad(B.sep)) L.push("你出門後會一直叫，可以先試短時間外出");
  if (S.habits.has("dawn")) L.push("清晨會叫你起床討飯");
  if (isBad(B.door)) L.push("會衝門口，進出門要先確認牠在哪");
  if (S.care.nail === 1 || S.care.nail === 2) L.push("剪指甲" + (S.care.nail === 1 ? "要用毛巾包或兩個人" : "很困難，可以請醫院幫忙"));
  if (S.touch.belly === 3) L.push("不喜歡被摸肚子");
  const page = QUICK.findIndex(p => p.key === "arrival") + 1;
  return L.length ? L : [`還不知道${n}剛到家會怎樣，可以在快問第 ${page} 頁補`];

function count(obj) { return Object.values(obj).filter(v => v != null).length; }

/* ---------- AI 介紹、稱號和座右銘（示範用範本；正式版改呼叫新的 LLM 任務，例如 POST /api/onboarding/cat-blurb，

function genBlurb(v) {
  const f = S.f, n = f.name || "牠", P = new Set(personalityTags()), H = S.habits, T = S.traits;
  const stage = ["小", "", "老"][f.stage] ?? "";
  const look = [f.coat, f.breed].filter(Boolean).join("");
  const from = ["從街頭被撿回來", "曾經被放棄過，但沒有放棄相信人", "因為前飼主沒辦法再照顧而來到中途", "從收容所出來"][f.from];
  const traits = [];
  if (P.has("黏人")) traits.push(["是標準的跟屁蟲，你走到哪牠跟到哪", "黏人程度滿分，洗澡都要在門口站崗", "最大的興趣是黏在你身邊"][v % 3]);
  if (P.has("獨立")) traits.push("喜歡有自己的空間，想撒嬌時會自己來找你");
  if (P.has("親人")) traits.push("見到人就會主動靠過來");
  if (P.has("好奇") || P.has("活潑") || P.has("愛玩")) traits.push(["對什麼都好奇，紙箱和塑膠袋都要親自檢查", "精力旺盛，逗貓棒一拿出來就上鉤", "一天到晚都在找好玩的事"][v % 3]);
  if (P.has("慵懶")) traits.push("最喜歡找個舒服的地方睡一整天");
  if (P.has("膽小") || P.has("怕生")) traits.push("一開始會害羞躲起來，熟了以後會給你很多呼嚕");
  if (P.has("貪吃")) traits.push("聽到罐頭聲音會用最快的速度出現");
  if (P.has("愛撒嬌") || P.has("愛被抱")) traits.push("很愛撒嬌，抱起來就開始呼嚕");
  if (P.has("會等門")) traits.push("每天都會在門口等你回家");
  if (P.has("溫和")) traits.push("脾氣很好，很少生氣");
  if (P.has("愛咬人")) traits.push("玩到興奮會咬手，需要一位會用玩具陪玩的家人");
  const liked = ZONES.filter(z => S.touch[z[0]] === 1).map(z => z[1]);
  const touch = liked.length ? `最喜歡被摸${liked.slice(0, 2).join("和")}` : "";
  const opener = [`${n}是一隻${stage}${look ? look : "貓"}`, `來認識一下${n}吧！牠是一隻${stage}${look ? look : "貓"}`, `嗨，我們家的${n}是${stage}${look ? look : "貓"}`][v % 3];
  const intro = [opener + (from ? `，${from}` : "") + "。", traits.length ? traits.join("，") + "。" : "", touch ? touch + "。" : "",
    ["正在等一個願意陪牠長大的家！", "如果你也想要每天回家都有人迎接，就來認識牠吧！", "準備好一起生活了嗎？"][v % 3]].join("");
  // 稱號：名字上方的一句話（像巴克幫的「陽光大男孩」），照量表挑
  const nicks = [];
  if (T.bond >= 4 && T.energy >= 4) nicks.push("黏人的小太陽");
  if (T.bond >= 4 && T.brave <= 2) nicks.push("慢熟的撒嬌鬼");
  if (T.bond >= 4) nicks.push("專屬小跟班");
  if (T.brave <= 2) nicks.push("害羞的小可愛");
  if (T.energy >= 4) nicks.push("精力無限的跑酷王");
  if (T.brave >= 4) nicks.push("好奇的小探險家");
  if (T.energy <= 2) nicks.push("愛睡的懶懶貓");
  if (T.bond <= 2) nicks.push("有個性的獨行俠");
  if (P.has("貪吃")) nicks.push("罐罐鑑賞家");
  if (P.has("愛撒嬌")) nicks.push("撒嬌界的高手");
  if (f.stage === 2) nicks.push("溫柔的老紳士");
  nicks.push("等你帶回家的好孩子");
  // 座右銘：改編俗語的搞笑版，先放符合這隻貓個性的，再放通用的
  const pool = [];
  if (P.has("黏人") || P.has("親人")) pool.push("一日不見，如隔三餐。", "你走到哪裡，我就躺到哪裡。");
  if (P.has("愛咬人") || P.has("愛玩") || P.has("活潑")) pool.push("君子動口不動手，我動口也動手。", "玩不玩得盡興，看你的手速。");
  if (P.has("貪吃")) pool.push("人要衣裝，貓要罐裝。", "車到山前必有路，罐到嘴前必有我。");
  if (P.has("膽小") || P.has("怕生")) pool.push("退一步海闊天空，退兩步就是床底。", "敵不動，我不動；敵一動，我先躲。");
  if (P.has("好奇")) pool.push("打破砂鍋問到底，打翻水杯看到底。", "書中自有黃金屋，紙箱自有我的家。");
  if (P.has("慵懶") || P.has("獨立")) pool.push("能躺著絕不坐著，能坐著絕不站著。");
  if (H.has("dawn")) pool.push("早起的鳥兒有蟲吃，早起的貓咪有你餵。");
  if (H.has("night") || P.has("愛叫")) pool.push("夜深人靜，正是本喵跑酷時。");
  pool.push("在哪裡跌倒，就在哪裡躺下。", "天塌下來，有紙箱頂著。", "吃飯皇帝大，睡覺皇帝更大。", "貓生苦短，及時罐罐。", "知足常樂，知罐更樂。", "三思而後行，三睡而後吃。");
  return { intro, motto: pool[v % pool.length], nick: nicks[v % nicks.length] };
}

function completeness() {
  const checks = [
    S.angles.front, S.angles.back, S.others.length, S.f.sex != null, S.f.coat, S.f.from != null, S.f.kg,
    S.h.neuter != null, S.h.vaccine != null, S.h.fiv != null, S.h.chip != null,

  return Math.round(checks.filter(Boolean).length / checks.length * 100);
}

    </div>
    <section class="card" style="margin-top:24px;display:flex;align-items:center;gap:16px" aria-labelledby="fill">
      <svg width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="資料完整度 ${pct}%" style="flex:none">
        <circle cx="36" cy="36" r="30" fill="none" stroke="#efe3cf" stroke-width="8"/>
        <circle cx="36" cy="36" r="30" fill="none" stroke="#e8913a" stroke-width="8" stroke-linecap="round" stroke-dasharray="${dash} 189" transform="rotate(-90 36 36)"/>
        <text x="36" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#3f2e24" font-family="Quicksand, sans-serif">${pct}%</text>
      </svg>
      <div class="stack" style="gap:4px">
        <h2 id="fill" style="font-size:16px">${skipped.length ? `再補 ${skipped.length} 項，試養會更像${esc(n)}` : "資料很完整，試養會很像牠"}</h2>
        ${skipped.length ? `<span class="muted" style="font-size:14px">還沒填：${skipped.join("、")}</span><button type="button" class="link-btn" style="align-self:flex-start;padding:0" data-act="refill">現在補</button>` : ""}
      </div>
    </section>
    </div>
    <div class="grow"></div>
    <div class="narrow done-actions">
      ${catBtn("出領養任務", "tasks")}
      <div class="two">
        <button type="button" class="ghost-btn" data-act="model">看 3D 模型</button>
        <button type="button" class="ghost-btn" data-act="restart">再新增一隻</button>
      </div>
    </div>`, false);
}

const VIEWS = { photo: vPhoto, talk: vTalk, quick: vQuick, touch: vTouch, review: vReview, done: vDone };
const app = document.getElementById("app");
function render(scrollTop) {
  if (S.step === "review") ensureBlurb();
  app.innerHTML = VIEWS[S.step]();
  if (S.step === "talk") bindMic();
  if (scrollTop) window.scrollTo(0, 0);
}
function go(step) { S.step = step; S.missing = []; render(true); }

/* ================================================================
   給 Meowho：畫面狀態 → meow_cats 欄位
   ================================================================ */
function toMeowhoPayload() {
  const f = S.f, h = S.h;
  const done = v => v == null ? "unknown" : v === 0 ? "done" : v === 1 ? "not_done" : "unknown";
  return {
    name: f.name.trim(),
    sex: ["male", "female", "unknown"][f.sex] ?? "unknown",
    life_stage: ["kitten", "adult", "senior"][f.stage] ?? null,
    est_age_months: ageMonths(),
    coat: f.coat || null, breed: f.breed || null,
    personality_tags: personalityTags(),
    // 新欄位（需 migration）：四條個性量表 1–5（null = 沒填）和中途的補充
    personality_scale: Object.fromEntries(TRAITS.map(t => [t.key, S.traits[t.key] ?? null])),
    personality_notes: Object.fromEntries(Object.entries(S.traitNote).filter(([, v]) => v)),
    description: S.story || null,
    // 新欄位（需 migration）：介紹（預設是 AI 依個性挑的座右銘，中途可改）；description 仍存中途原話
    intro: S.intro || null,
    cover: S.cover, // 中途選的封面：a:front／a:left／a:back／o:第幾張
    medical: {
      neutered: done(h.neuter), vaccineDoses: h.vaccine, dewormInternal: h.deworm.includes(0) ? "done" : "unknown", dewormExternal: h.deworm.includes(1) ? "done" : "unknown",
      fivFelv: ["negative", "fiv_positive", "untested"][h.fiv] ?? "untested", microchip: ["yes", "no"][h.chip] ?? "unknown",
      history: h.body || null, medication: h.med || null,
      health_tags: healthTags(),
      // 給試養遊戲的 AI：遊戲沒有寫好劇情的健康標籤，加上中途自己填的內容，請 AI 安排照顧劇情（不可寫成診斷）
      ai_story: { tags: healthTags().filter(t => !HEALTH_TAGS.some(([x, g]) => x === t && g) && t !== "FIV陽性"), text: [h.body, h.med].filter(Boolean).join("；") || null }
    },
    compat: { cats: ["yes", "maybe", "no", "unknown"][S.meet.cats] ?? null, dogs: ["yes", "maybe", "no", "unknown"][S.meet.dogs] ?? null, kids: ["yes", "maybe", "no", "unknown"][S.meet.kids] ?? null },
    habits: [...S.habits],
    // 新欄位（需 migration）：問題行為 none / sometimes / often / unknown
    behavior: Object.fromEntries(Object.entries(S.prob).filter(([, v]) => v != null).map(([k, v]) => [k, { level: ["none", "sometimes", "often", "unknown"][v], note: S.probNote[k] || null }])),
    // 新欄位（需 migration）：照護配合度、相處細項、剛到家、觸摸、來源、體重
    care: {
      handling: Object.fromEntries(Object.entries(S.care).map(([k, v]) => [k, ["easy", "tricky", "hard", "untried"][v]])),
      strangers: ["yes", "maybe", "no", "unknown"][S.meet.guest] ?? null,
      compatNotes: Object.fromEntries(Object.entries(S.meetNote).filter(([, v]) => v)),
      arrival: Object.fromEntries(Object.entries(S.arrival).map(([k, v]) => [k, ["same_day", "1_3_days", "within_week", "longer"][v]])),
      touch: Object.fromEntries(Object.entries(S.touch).filter(([, v]) => v).map(([k, v]) => [k, ["", "love", "ok", "no"][v]])),
      touchLimit: ["few_strokes", "1_2_min", "long", "mood"][S.dur] ?? null,
      touchSigns: [...S.signs],
      origin: ["street", "abandoned", "rehomed", "shelter"][f.from] ?? null,
      since: f.since || null, weightKg: f.kg ? Number(f.kg) : null,
      favoriteSnack: S.notes.snack || null, cautionNote: S.notes.caution || null, otherNote: S.notes.other || null
    },
    consent: S.consent
  };
}
window.toMeowhoPayload = toMeowhoPayload;

/* ================================================================
   事件
   ================================================================ */
function readFile(file) { return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file); }); }

app.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.angle && t.files[0]) {
    S.angles[t.dataset.angle] = await readFile(t.files[0]);
    // 正式版：送 /api/onboarding/cat-photo 判讀；這裡示範照片猜到的毛色、品種
    if (!S.f.coat) { S.f.coat = "橘白色"; S.f.breed = "米克斯"; S.guessed.add("coat"); S.guessed.add("breed"); }
    S.missing = []; render();
  } else if (t.dataset.others && t.files.length) {
    for (const file of [...t.files].slice(0, MAX_OTHERS - S.others.length)) S.others.push(await readFile(file));
    // 正式版：送 /api/onboarding/cat-photo 判讀；這裡示範照片猜到的毛色、品種
    if (!S.f.coat) { S.f.coat = "橘白色"; S.f.breed = "米克斯"; S.guessed.add("coat"); S.guessed.add("breed"); }
    S.missing = [];
    render();
  } else if (t.dataset.bindCheck) {
    S[t.dataset.bindCheck] = t.checked;
  }
});
// 個性拉桿：拉的時候只更新文字，放開後才重畫（才會出現補充欄和清除）
function traitLive(el) {
  const k = el.dataset.trait, v = +el.value, t = TRAITS.find(x => x.key === k);
  S.traits[k] = v; el.classList.remove("unset"); el.setAttribute("aria-valuetext", SCALE_WORD[k][v - 1]);
  const tw = document.getElementById("tw-" + k); if (tw) { tw.textContent = SCALE_WORD[k][v - 1]; tw.style.color = "var(--orange-deep)"; }
  document.querySelectorAll(`#w-${k} span`).forEach((s, j) => s.classList.toggle("on", j === v - 1));
}
app.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.trait) { traitLive(e.target); render(); } });
["pointerup", "keyup"].forEach(ev => app.addEventListener(ev, e => {
  const el = e.target; if (!el.dataset || !el.dataset.trait) return;
  if (S.traits[el.dataset.trait] == null) { traitLive(el); render(); } // 沒拉動直接點中間，也算選了
}));
app.addEventListener("input", e => {
  if (e.target.dataset.trait) { traitLive(e.target); return; }
  const p = e.target.dataset.bind;
  if (!p) return;
  setPath(p, e.target.value);
  if (p === "f.ageNum") {
    S.f.stage = stageOf();
    document.querySelectorAll('[data-path="f.stage"]').forEach(b => b.setAttribute("aria-checked", String(+b.dataset.v === S.f.stage)));
  }
  if (p === "intro") { const m = document.getElementById("previewIntro"); if (m) m.textContent = e.target.value; }
  const key = p.split(".").pop();
  S.guessed.delete(key);
});

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  switch (act) {
    case "back":
      if (S.step === "talk") go("photo");
      else if (S.step === "quick") { if (S.qp > 0) { S.qp--; render(true); } else go("talk"); }
      else if (S.step === "touch") { S.qp = QUICK.length - 1; go("quick"); }
      else if (S.step === "review") go("touch");
      break;
    case "toTalk":
      if (!S.angles.left) { S.missing = ["側面照片"]; render(); break; }
      go("talk"); break;
    case "toQuick": case "toReview": {
      if (S.step === "talk") {
        const miss = [];
        if (!S.f.name.trim()) miss.push("名字");
        if (S.f.stage == null) miss.push("年紀");
        if (miss.length) { S.missing = miss; render(); break; }
      }
      if (act === "toQuick") { S.qp = 0; go("quick"); } else go("review");
      break;
    }
    case "qNext":
      if (S.qp < QUICK.length - 1) { S.qp++; render(true); } else go("touch");
      break;
    case "pick": {
      const cur = getPath(b.dataset.path);
      setPath(b.dataset.path, cur === +v ? null : +v);
      render(); break;
    }
    case "toggle": { const set = getPath(b.dataset.path); set.has(v) ? set.delete(v) : set.add(v); render(); break; }
    case "toTraits": S.qp = 0; go("quick"); break;
    case "clearTrait": delete S.traits[v]; render(); break;
    case "ageUnit": S.f.ageUnit = +v; S.f.stage = stageOf(); render(); break;
    case "deworm": { const i = S.h.deworm.indexOf(+v); i >= 0 ? S.h.deworm.splice(i, 1) : S.h.deworm.push(+v); render(); break; }
    case "zone": S.touch[v] = ((S.touch[v] || 0) + 1) % 4; render(); break;
    case "rmOther": {
      const i = +v; S.others.splice(i, 1);
      if (S.cover && S.cover[0] === "o") { const c = +S.cover.slice(2); S.cover = c === i ? null : c > i ? "o:" + (c - 1) : S.cover; }
      render(); break;
    }
    case "cover": e.preventDefault(); S.cover = v; render(); break;
    case "clearStory": S.story = ""; S.status = ""; render(); document.getElementById("story")?.focus(); break;
    case "sendStory": {
      if (!S.story.trim()) { S.status = "先說幾句，或打字貼上"; render(); break; }
      const n = parseStory(S.story);
      S.status = n ? `已填好 ${n} 格，可以再說一段補充` : "沒有抓到可以填的，下面直接點選也可以";
      render(); break;
    }
    case "create": {
      const miss = [];
      if (!S.f.name.trim()) miss.push("名字");
      if (S.f.stage == null) miss.push("年紀");
      if (!S.angles.left) miss.push("側面照片");
      if (!S.consent) miss.push("同意授權");
      if (miss.length) { S.missing = miss; render(); break; }
      console.log("meow_cats payload", toMeowhoPayload());
      go("done"); break;
    }
    case "reBlurb": { S.blurbV++; S.intro = genBlurb(S.blurbV).motto; render(); break; }
    case "refill": S.qp = 0; go("quick"); break;
    case "tasks": case "model": alert("示範版：正式版會前往 /cats/<id>/tasks 或 /cats/<id>"); break;
    case "restart": location.reload(); break;
  }
});

/* ================================================================
   語音（瀏覽器內建，zh-TW；正式版沿用 lib/onboarding/speech.ts）
   ================================================================ */
function bindMic() {
  const mic = document.getElementById("mic"), label = document.getElementById("micLabel"), box = document.getElementById("story");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    mic.addEventListener("click", () => { document.getElementById("status").textContent = "這個瀏覽器不支援語音，請直接打字"; box.focus(); });
    return;
  }
  let rec = null, base = "";
  const start = e => {
    e.preventDefault();
    if (rec) return;
    rec = new SR(); rec.lang = "zh-TW"; rec.interimResults = true; rec.continuous = true;
    base = box.value ? box.value.replace(/\s*$/, "") + (/[。，！？]$/.test(box.value.trim()) ? "" : "，") : "";
    if (!box.value) base = "";
    rec.onresult = ev => {
      let text = "";
      for (let i = 0; i < ev.results.length; i++) text += ev.results[i][0].transcript;
      box.value = base + text; S.story = box.value;
    };
    rec.onerror = ev => { document.getElementById("status").textContent = ev.error === "not-allowed" ? "要允許使用麥克風才能用說的" : "沒有聽清楚，再試一次"; };
    rec.onend = () => { rec = null; mic.classList.remove("on"); label.textContent = "按住說說牠"; };
    rec.start(); mic.classList.add("on"); label.textContent = "放開就停止";
  };
  const stop = () => { if (rec) rec.stop(); };
  mic.addEventListener("pointerdown", start);
  ["pointerup", "pointerleave", "pointercancel"].forEach(t => mic.addEventListener(t, stop));
  mic.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !rec) start(e); });
  mic.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") stop(); });
}

render();
</script>
