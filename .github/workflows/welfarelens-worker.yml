name: WelfareLens Worker
on:
  pull_request:
    paths:
      - 'workers/welfarelens/**'
      - '.github/workflows/welfarelens-worker.yml'
      - 'src/lib/home-safety/report-view*.ts'
  push:
    branches: [main]
    paths:
      - 'workers/welfarelens/**'
      - '.github/workflows/welfarelens-worker.yml'
      - 'src/lib/home-safety/report-view*.ts'
    tags: ['welfarelens-v*']
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workers/welfarelens
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/welfarelens/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: bash -n scripts/queue-service.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: workers/welfarelens
          file: workers/welfarelens/Dockerfile.worker
          platforms: linux/amd64
          load: true
          tags: welfarelens-worker:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=welfarelens-worker
          cache-to: type=gha,mode=max,scope=welfarelens-worker
      - name: Run Worker source tests with packaged FFmpeg
        run: |
          run_test() {
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$PWD,dst=/workspace" --workdir /workspace \
              -e NODE_ENV=test --entrypoint npm welfarelens-worker:ci "$@"
          }
          run_test run worker:test-fixture
          run_test test
      - run: docker run --rm --network none welfarelens-worker:ci --self-test
      - name: Test report stack without network
        run: |
          mkdir -p "${{ runner.temp }}/welfarelens-offline"
          chmod 0777 "${{ runner.temp }}/welfarelens-offline"
          docker run --rm --network none --mount "type=bind,src=$PWD/welfarelens-video-spike/samples/synthetic-room.mp4,dst=/tmp/synthetic-room.mp4,readonly" --mount "type=bind,src=${{ runner.temp }}/welfarelens-offline,dst=/data" welfarelens-worker:ci --fixture evals/fixtures/worker-scene.json --input /tmp/synthetic-room.mp4 --root /data
      - name: Verify actual image report and queue contracts
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/tests,dst=/app/tests,readonly" \
            --mount "type=bind,src=$PWD/welfarelens-video-spike/samples,dst=/app/welfarelens-video-spike/samples,readonly" \
            -e WELFARELENS_TEST_PDF_BROWSER=/usr/bin/chromium --entrypoint node welfarelens-worker:ci \
            --experimental-strip-types --test tests/video-before-after.test.mjs tests/meowho-worker-mode.test.mjs tests/modernization-contract.test.mjs tests/meowho-worker.test.mjs tests/standalone-worker.test.mjs
      - name: Run packaged Benchmark preflight offline
        run: |
          set -euo pipefail
          input="$PWD/welfarelens-video-spike/samples/synthetic-room.mp4"
          batch="$(mktemp -d)"
          export BENCH_INPUT_SHA="$(sha256sum "$input" | cut -d' ' -f1)"
          export BENCH_IMAGE_ID="$(docker image inspect --format='{{.Id}}' welfarelens-worker:ci)"
          export BENCH_REVISION="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' welfarelens-worker:ci)"
          test "$BENCH_REVISION" = "$GITHUB_SHA"
          node --input-type=module - "$batch" <<'JS'
          import { writeFileSync } from 'node:fs';
          const { BENCH_INPUT_SHA, BENCH_IMAGE_ID, BENCH_REVISION } = process.env;
          // Locally loaded CI image has no repository digest. This value is an offline fixture only.
          const digest = 'sha256:' + '0'.repeat(64);
          const model = {host:'fixture.openai.azure.com', deployment:'fixture', version:'fixture',
            sku:'fixture', confirmedRpm:6, gapMs:12000, reserveUsdMicros:1};
          writeFileSync(process.argv[2] + '/approval.json', JSON.stringify({
            approvalRef:'offline-ci-fixture', commit:BENCH_REVISION, digest, inputSha256:BENCH_INPUT_SHA,
            pilotUsdMicros:30000000, batchUsdMicros:40000000, vlm:model, image:model,
          }));
          writeFileSync(process.argv[2] + '/identity.json', JSON.stringify({
            ref:'ghcr.io/gae265-meowho/meowho/welfarelens-worker@' + digest,
            revision:BENCH_REVISION, imageId:BENCH_IMAGE_ID,
          }));
          JS
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$batch,dst=/batch" \
            --mount "type=bind,src=$input,dst=/tmp/fixture.mp4,readonly" \
            -e AZURE_OPENAI_ENDPOINT=https://fixture.openai.azure.com -e AZURE_OPENAI_DEPLOYMENT=fixture -e AZURE_OPENAI_API_KEY=fixture \
            -e AZURE_IMAGE_ENDPOINT=https://fixture.openai.azure.com -e AZURE_IMAGE_DEPLOYMENT=fixture -e AZURE_IMAGE_API_KEY=fixture \
            --entrypoint node "$BENCH_IMAGE_ID" --experimental-strip-types scripts/pipeline-benchmark.ts \
            --preflight --config /batch/approval.json --input /tmp/fixture.mp4 --batch /batch \
            --image-identity "$(cat "$batch/identity.json")"
          test ! -e "$batch/requests.jsonl"
      - name: Export tested image
        if: startsWith(github.ref, 'refs/tags/welfarelens-v') && vars.WELFARELENS_GHCR_RELEASE == 'true'
        run: |
          set -o pipefail
          docker save welfarelens-worker:ci | gzip > "$RUNNER_TEMP/welfarelens-worker.tar.gz"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/welfarelens-v') && vars.WELFARELENS_GHCR_RELEASE == 'true'
        with:
          name: welfarelens-worker
          path: ${{ runner.temp }}/welfarelens-worker.tar.gz
          retention-days: 1
          compression-level: 0
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/welfarelens-v') && vars.WELFARELENS_GHCR_RELEASE == 'true'
    needs: worker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: welfarelens-worker
      - name: Publish and verify the tested digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          docker load --input welfarelens-worker.tar.gz
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          package="ghcr.io/${REPOSITORY,,}/welfarelens-worker"
          tag="$package:sha-$GITHUB_SHA"
          docker tag welfarelens-worker:ci "$tag"
          docker push "$tag"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag")"
          test "${digest%@*}" = "$package"
          docker pull --platform linux/amd64 "$digest"
          test "$(docker image inspect --format='{{.Id}}' "$digest")" = "$(docker image inspect --format='{{.Id}}' welfarelens-worker:ci)"
          test "$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$digest")" = "$GITHUB_SHA"
          docker run --rm --network none "$digest" --self-test
          printf '%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
