name: WelfareLens Worker
on:
  pull_request:
    paths:
      - 'workers/welfarelens/**'
      - '.github/workflows/welfarelens-worker.yml'
      - '.github/workflows/welfarelens-worker-image.yml'
      - 'src/lib/home-safety/report-view*.ts'
      - 'supabase/migrations/0042_meow_env_scoped_queue.sql'
      - 'supabase/tests/0042_welfarelens_queue.integration.mjs'
  push:
    branches: [main]
    paths:
      - 'workers/welfarelens/**'
      - '.github/workflows/welfarelens-worker.yml'
      - '.github/workflows/welfarelens-worker-image.yml'
      - 'src/lib/home-safety/report-view*.ts'
      - 'supabase/migrations/0042_meow_env_scoped_queue.sql'
      - 'supabase/tests/0042_welfarelens_queue.integration.mjs'
    tags: ['welfarelens-v*']
permissions:
  contents: read
jobs:
  worker:
    if: "!startsWith(github.ref, 'refs/tags/welfarelens-v') || vars.WELFARELENS_GHCR_RELEASE != 'true'"
    uses: ./.github/workflows/welfarelens-worker-image.yml
    permissions:
      contents: read
    with:
      publish: false
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/welfarelens-v') && vars.WELFARELENS_GHCR_RELEASE == 'true'
    uses: ./.github/workflows/welfarelens-worker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true
